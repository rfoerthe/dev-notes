<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>DevNotes | Der Developer Blog</title>
    <meta name="description" content="DevNotes ist ein moderner, interaktiver Blog für Softwareentwickler. Teile dein Wissen, lies tiefgehende Artikel zu React, Vite, TS, und vernetze dich." />
    <meta name="author" content="Roland Förther" />
    <meta name="theme-color" content="#0a0e1a" />

    <!-- PWA: the manifest link is injected by vite-plugin-pwa at build time.
         iOS ignores the manifest's icons and display mode, so it needs its own tags. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="DevNotes" />

    <!-- Open Graph (social share metadata) -->
    <meta property="og:title" content="DevNotes | Der Developer Blog" />
    <meta property="og:description" content="DevNotes ist ein moderner, interaktiver Blog für Softwareentwickler. Teile dein Wissen, lies tiefgehende Artikel zu React, Vite, TS." />
    <meta property="og:type" content="website" />
    
    <!-- Google Fonts: Inter (reading body) and Outfit (headings/UI).
         Preloaded rather than linked as a stylesheet so the first paint does
         not wait for fonts.googleapis.com; src/main.tsx turns the link into a
         stylesheet before React renders (the CSP has no 'unsafe-inline' for
         scripts, so this cannot be an onload attribute). The <noscript>
         fallback keeps the fonts for script-less user agents. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link id="google-fonts" rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
